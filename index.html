<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>贪吃蛇游戏 (修复版)</title>
    <style>
        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Arial', sans-serif;
            touch-action: none; /* 防止在移动设备上滑动时页面滚动 */
        }

        h1 {
            color: #333;
        }

        #game-board {
            border: 3px solid #333;
            background-color: #fff;
            touch-action: none; /* 确保触摸事件在canvas上被捕获 */
        }

        #score {
            font-size: 1.5em;
            margin-top: 20px;
            color: #555;
        }

        #controls-info {
            margin-top: 15px;
            color: #666;
        }
    </style>
</head>
<body>

    <h1>贪吃蛇</h1>
    <canvas id="game-board" width="400" height="400"></canvas>
    <div id="score">分数: 0</div>
    <div id="controls-info">电脑: 使用方向键 | 手机: 滑动屏幕</div>

    <script>
        const board = document.getElementById('game-board');
        const context = board.getContext('2d');
        const scoreElement = document.getElementById('score');

        const gridSize = 20;
        let snake = [{ x: 10, y: 10 }];
        let food = {};
        let direction = 'right';
        let score = 0;
        let gameOver = false;
        let changingDirection = false;

        // --- BUG修复：降低游戏速度 ---
        // 将延迟时间从 100ms 增加到 200ms，数值越大，蛇移动越慢
        const gameSpeed = 200;

        // 主游戏循环
        function main() {
            if (gameOver) {
                alert("游戏结束! 你的分数是: " + score);
                document.location.reload();
                return;
            }

            changingDirection = false;
            setTimeout(function onTick() {
                clearCanvas();
                drawFood();
                moveSnake();
                drawSnake();
                main();
            }, gameSpeed);
        }

        // 清空画布
        function clearCanvas() {
            context.fillStyle = 'white';
            context.fillRect(0, 0, board.width, board.height);
        }

        // 绘制蛇
        function drawSnake() {
            snake.forEach(drawSnakePart);
        }

        // 绘制蛇的每一部分
        function drawSnakePart(snakePart) {
            context.fillStyle = 'lightgreen';
            context.strokeStyle = 'darkgreen';
            context.fillRect(snakePart.x * gridSize, snakePart.y * gridSize, gridSize, gridSize);
            context.strokeRect(snakePart.x * gridSize, snakePart.y * gridSize, gridSize, gridSize);
        }
        
        // 移动蛇
        function moveSnake() {
            const head = { x: snake[0].x, y: snake[0].y };

            switch (direction) {
                case 'up': head.y -= 1; break;
                case 'down': head.y += 1; break;
                case 'left': head.x -= 1; break;
                case 'right': head.x += 1; break;
            }

            snake.unshift(head);
            
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = '分数: ' + score;
                createFood();
            } else {
                snake.pop();
            }

            checkCollision();
        }

        // 检查碰撞
        function checkCollision() {
            const head = snake[0];
            if (head.x < 0 || head.x >= board.width / gridSize || head.y < 0 || head.y >= board.height / gridSize) {
                gameOver = true;
            }
            for (let i = 4; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    gameOver = true;
                    break;
                }
            }
        }
        
        // 随机生成食物
        function createFood() {
            food.x = Math.floor(Math.random() * (board.width / gridSize));
            food.y = Math.floor(Math.random() * (board.height / gridSize));
            snake.forEach(function isFoodOnSnake(part) {
                if (part.x === food.x && part.y === food.y) {
                    createFood();
                }
            });
        }
        
        // 绘制食物
        function drawFood() {
            context.fillStyle = 'red';
            context.strokeStyle = 'darkred';
            context.fillRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
            context.strokeRect(food.x * gridSize, food.y * gridSize, gridSize, gridSize);
        }

        // --- BUG修复：增加滑动控制 ---
        let touchStartX = 0;
        let touchStartY = 0;
        let touchEndX = 0;
        let touchEndY = 0;

        board.addEventListener('touchstart', function(event) {
            touchStartX = event.changedTouches[0].screenX;
            touchStartY = event.changedTouches[0].screenY;
        }, false);

        board.addEventListener('touchend', function(event) {
            touchEndX = event.changedTouches[0].screenX;
            touchEndY = event.changedTouches[0].screenY;
            handleSwipe();
        }, false); 

        function handleSwipe() {
            if (changingDirection) return;
            
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;
            const absDx = Math.abs(dx);
            const absDy = Math.abs(dy);

            // 确定是水平滑动还是垂直滑动
            if (absDx > absDy) {
                // 水平滑动
                if (dx > 0 && direction !== 'left') {
                    setDirection('right');
                } else if (direction !== 'right') {
                    setDirection('left');
                }
            } else {
                // 垂直滑动
                if (dy > 0 && direction !== 'up') {
                    setDirection('down');
                } else if (direction !== 'down') {
                    setDirection('up');
                }
            }
        }
        
        // 监听键盘事件
        document.addEventListener('keydown', handleKeyPress);

        function handleKeyPress(event) {
            const keyPressed = event.key;
            if (keyPressed === 'ArrowUp' && direction !== 'down') {
                setDirection('up');
            }
            if (keyPressed === 'ArrowDown' && direction !== 'up') {
                setDirection('down');
            }
            if (keyPressed === 'ArrowLeft' && direction !== 'right') {
                setDirection('left');
            }
            if (keyPressed === 'ArrowRight' && direction !== 'left') {
                setDirection('right');
            }
        }
        
        // 统一设置方向的函数，防止重复操作
        function setDirection(newDirection) {
            if (changingDirection) return;
            changingDirection = true;
            direction = newDirection;
        }

        // 游戏开始
        createFood();
        main();

    </script>
</body>
</html>
